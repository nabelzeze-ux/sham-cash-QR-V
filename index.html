<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Sham Cash QR</title>
    <style>
        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
        }
        
        html, body {
            width: 100%;
            height: 100%;
            background: #ffffff; /* خلفية بيضاء نقية بالكامل */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
        }

        .container {
            text-align: center;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* العنوان باللون الأزرق الفاتح وبدون إيموجي */
        h2 {
            color: #00aaff; /* لون أزرق فاتح جذاب */
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        /* حاوية الصورة أبيض نقي */
        .qr-card {
            background-color: #ffffff;
            padding: 10px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 320px;
            width: 85vw;
            justify-content: center;
        }

        .qr-card img {
            width: 100%;
            height: auto;
            max-width: 280px;
            display: block;
            border-radius: 8px;
        }

        /* النص أسفل الباركود */
        .scan-text {
            color: #222222;
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
        }

        /* نصوص حالات التحميل والخطأ */
        .status-msg {
            font-size: 15px;
            font-weight: bold;
        }
        .loading { color: #555555; }
        .error { color: #d32f2f; }
        .sub-text { color: #777777; font-size: 13px; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Sham Cash QR</h2>
        
        <div class="qr-card">
            <div id="qrContent">
                <p class="status-msg loading">⏳ جاري تحميل الباركود...</p>
            </div>
        </div>
    </div>

    <script>
        // جلب رابط الصورة الممرر من البوت عبر الـ URL
        var urlParams = new URLSearchParams(window.location.search);
        var imgUrl = urlParams.get('img');
        
        var qrContent = document.getElementById('qrContent');
        
        if (imgUrl) {
            var img = document.createElement('img');
            img.src = decodeURIComponent(imgUrl);
            img.alt = 'Sham Cash QR Code';
            
            // عند نجاح تحميل الصورة
            img.onload = function() {
                qrContent.innerHTML = '';
                qrContent.appendChild(img);
                
                // إضافة النص تحت الصورة
                var text = document.createElement('p');
                text.className = 'scan-text';
                text.innerText = 'أمسح رمز الاستجابة السريع';
                qrContent.appendChild(text);
            };
            
            // في حال وجود مشكلة بالرابط
            img.onerror = function() {
                qrContent.innerHTML = '<p class="status-msg error">❌ تعذر تحميل الباركود</p><p class="sub-text">يرجى إعادة إرساله من لوحة التحكم</p>';
            };
        } else {
            // إذا فتح الصفحة بدون تمرير رابط
            qrContent.innerHTML = '<p class="status-msg error">❌ لم يتم تعيين باركود بعد</p><p class="sub-text">يرجى رفع الرمز من البوت أولاً</p>';
        }
    </script>
</body>
</html>
